<svg xmlns="http://www.w3.org/2000/svg" width="276" height="160" viewBox="0 0 276 160">
<style>
.line{stroke:#d0d7de}.soft-line{stroke:#eaeef2}
.card{fill:#f6f8fa;stroke:#d0d7de}
.mark{fill:#ffffff;stroke:#d0d7de}
.linkedin{fill:#0a66c2}.linkedin-text{fill:#fff}
.arrow{stroke:#57606a;fill:none}
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
.mono,.label,.status,.intro,.mark-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.hero{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-style:italic;font-size:34px}
.hero-mobile{font-size:24px}
.intro,.status{font-size:13px}
.label{font-size:10px;font-weight:700;letter-spacing:1.1px}
.mark-text{font-size:12px;font-weight:700}
.section{font-size:15px;font-weight:500}.section-mobile{font-size:18px;font-weight:600}
.title{font-size:14px;font-weight:700}.title-mobile{font-size:17px}
.description{font-size:12px}.description-mobile{font-size:14.5px}
.label,.intro,.description{fill:#57606a}
</style>
<rect class="mark" x="8" y="10" width="44" height="44" rx="8"/>
<text x="30.0" y="36.0" class="mark-text" text-anchor="middle">CV</text>
<text x="72" y="24" class="title">Pollen</text>
<text x="72" y="41" class="title">Classification</text>
<text x="72" y="63" class="label mono">COMPUTER VISION ·</text>
<text x="72" y="76" class="label mono">CEFET-MG</text>
<text x="8" y="104" class="description">Compared five vision models across 52</text>
<text x="8" y="121" class="description">classes in VNUA-Pollen52 with Iago</text>
<text x="8" y="138" class="description">Santana.</text>
<line class="line" x1="2" y1="153" x2="274" y2="153"/>
